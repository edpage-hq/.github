# Example caller workflow — place this in EACH starter repo at .github/workflows/ci.yml
# This example is for laravel-inertia-starter; swap the "uses:" line for the
# matching reusable workflow in the other starters (node-lint-test.yml,
# flutter-test.yml, docs-build.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-test:
    uses: edpage-hq/.github/.github/workflows/php-lint-test.yml@master
