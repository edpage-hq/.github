# Reusable workflow — lives in edpage-hq/.github/.github/workflows/flutter-test.yml
# Minimal fallback for standalone Flutter work not based on flutter-starter.
# flutter-starter ships its own complete CI (codegen, coverage floor, release
# builds) and does not call this — new Flutter projects should come from
# flutter-starter and inherit that instead.
# Called from starter repos via:
#   uses: edpage-hq/.github/.github/workflows/flutter-test.yml@master
name: Flutter analyze & test

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Empty: the caller repository's CI_RUNNER variable
          (`edpage-mac`, the self-hosted Mac runner), else ubuntu-latest. A
          self-hosted runner uses the tools already installed on it (PHP,
          Flutter) instead of downloading them.
        type: string
        default: ''
      flutter-version:
        type: string
        default: "3.24.0"

jobs:
  analyze-test:
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: edpage-hq/.github/actions/setup-flutter@master
        with:
          flutter-version: ${{ inputs.flutter-version }}

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
