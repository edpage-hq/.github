# Reusable workflow — lives in edpage-hq/.github/.github/workflows/guide-build.yml
# Called from starter repos via:
#   uses: edpage-hq/.github/.github/workflows/guide-build.yml@master
name: Guide build check

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Empty: the caller repository's CI_RUNNER variable
          (`edpage-mac`, the self-hosted Mac runner), else ubuntu-latest. A
          self-hosted runner uses the tools already installed on it (PHP,
          Flutter) instead of downloading them.
        type: string
        default: ''
      node-version:
        type: string
        default: "20"

jobs:
  build:
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (fails on broken links/markdown)
        run: pnpm docs:build
