# Shared action — lives in edpage-hq/.github/actions/setup-php
# Use instead of shivammathur/setup-php:
#   - uses: edpage-hq/.github/actions/setup-php@master
#     with:
#       php-version: '8.3'
name: Setup PHP (edpage-hq)
description: >-
  On GitHub-hosted runners, installs PHP with shivammathur/setup-php. On the
  self-hosted Mac runner (`edpage-mac`), puts the Homebrew PHP of the
  requested version first on the PATH instead (setup-php would reinstall PHP
  through Homebrew on the host machine), with memory_limit=-1 like setup-php.

inputs:
  php-version:
    description: PHP version, major.minor (e.g. '8.3').
    required: true
  extensions:
    description: Extensions for setup-php. On the Mac runner, Homebrew's PHP already has the usual ones (pdo_mysql, pdo_sqlite, intl, gd, zip, …).
    default: ''
  coverage:
    description: Coverage driver for setup-php (none, xdebug, pcov). Not installed on the Mac runner.
    default: none
  tools:
    description: Tools for setup-php. On the Mac runner, Composer is already installed.
    default: ''

runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        tools: ${{ inputs.tools }}

    - if: runner.environment != 'github-hosted'
      shell: bash
      env:
        WANTED: ${{ inputs.php-version }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        prefix=$(brew --prefix 2>/dev/null || echo /opt/homebrew)
        for dir in "$prefix/opt/php@$WANTED/bin" "$prefix/opt/php/bin"; do
          if [ -x "$dir/php" ] && [ "$("$dir/php" -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "$WANTED" ]; then
            echo "$dir" >> "$GITHUB_PATH"
            # Same php.ini override as setup-php: Homebrew's default
            # memory_limit (128M) is too low for PHPStan. The leading ':'
            # keeps PHP's default scan directory (Homebrew's conf.d).
            ini_dir="$RUNNER_TEMP/php-ini"
            mkdir -p "$ini_dir"
            echo "memory_limit=-1" > "$ini_dir/zz-ci.ini"
            echo "PHP_INI_SCAN_DIR=:$ini_dir" >> "$GITHUB_ENV"
            "$dir/php" -v | head -1
            if [ "$COVERAGE" != "none" ]; then
              echo "::warning::No $COVERAGE coverage driver on the self-hosted runner"
            fi
            exit 0
          fi
        done
        echo "::error::This runner has no PHP $WANTED. Install it on the Mac: brew install php@$WANTED"
        exit 1
